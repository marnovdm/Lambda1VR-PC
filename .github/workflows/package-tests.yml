name: Package tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y rsync unzip zip zstd
      - name: Check shell syntax
        run: for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Run self-contained tests
        run: |
          tests/test-connect-sven-linux.sh
          tests/test-create-sven-linux-handoff.sh
          tests/test-linux-openxr-smoke.sh
          tests/test-they-hunger-mp-overlay.sh
